spring:
  application:
    name: inventory
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      format_sql: true
  datasource:
    url: ${INVENTORY_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST}
    virtual-host: ${SPRING_RABBITMQ_VHOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    order:
      created:
        inventory:
          queue: ${ORDER_CREATED_INVENTORY_QUEUE}
    payment:
      failed:
        inventory:
          queue: ${PAYMENT_FAILED_INVENTORY_QUEUE}
    inventory:
      reserved:
        queue: ${INVENTORY_RESERVED_QUEUE}
        exchange: ${INVENTORY_RESERVED_EXCHANGE}
        routingKey: ${INVENTORY_RESERVED_ROUTINGKEY}
      failed:
        order:
          queue: ${INVENTORY_FAILED_ORDER_QUEUE}
        payment:
          queue: ${INVENTORY_FAILED_PAYMENT_QUEUE}
        exchange: ${INVENTORY_FAILED_EXCHANGE}
        routingKey: ${INVENTORY_FAILED_ROUTINGKEY}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: "choreography-inventory"
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        otlp:
          endpoint: http://jaeger:4318/v1/traces
          enabled: true

logging:
  level:
    io.micrometer.tracing: DEBUG
    io.opentelemetry: DEBUG
    org.springframework.boot.actuate.autoconfigure.tracing: DEBUG

server:
  port: 8080