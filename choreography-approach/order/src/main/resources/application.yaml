spring:
  application:
    name: order
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      format_sql: true
  datasource:
    url: ${ORDER_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST}
    virtual-host: ${SPRING_RABBITMQ_VHOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        observation-enabled: true
    order:
      created:
        payment:
          queue: ${ORDER_CREATED_PAYMENT_QUEUE}
        inventory:
          queue: ${ORDER_CREATED_INVENTORY_QUEUE}
        exchange: ${ORDER_CREATED_EXCHANGE}
        routingKey: ${ORDER_CREATED_ROUTINGKEY}
      status:
        check:
          queue: ${ORDER_STATUS_CHECK_QUEUE}
          exchange: ${ORDER_STATUS_CHECK_EXCHANGE}
          routingKey: ${ORDER_STATUS_CHECK_ROUTINGKEY}
    payment:
      charged:
        queue: ${PAYMENT_CHARGED_QUEUE}
      failed:
        order:
          queue: ${PAYMENT_FAILED_ORDER_QUEUE}
    inventory:
      reserved:
        queue: ${INVENTORY_RESERVED_QUEUE}
      failed:
        order:
          queue: ${INVENTORY_FAILED_ORDER_QUEUE}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: "choreography-order"
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://jaeger:4318/v1/traces
          timeout: 30s
        schedule-delay: 1s
        max-batch-size: 256
        max-queue-size: 2048

server:
  port: 8080
