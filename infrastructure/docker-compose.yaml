services:
  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: my-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    entrypoint: >
      sh -c "
      rabbitmq-server & 
      rabbitmqctl wait /var/run/rabbitmq/pid; 
      rabbitmqctl add_vhost /choreography; 
      rabbitmqctl add_vhost /orchestration; 
      wait"
    networks:
      - my-global-network

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/var/prometheus
    networks:
      - my-global-network

  grafana:
    image: grafana/grafana:11.6.16
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - my-global-network

  order-db:
    image: postgres:18-alpine
    container_name: order-db
    ports:
      - "5433:5432"
    env_file:
      - "order/.env"
    volumes:
      - order-db-data:/var/lib/postgresql/18/data
    networks:
      - my-global-network

  payment-db:
    image: postgres:18-alpine
    container_name: payment-db
    ports:
      - "5434:5432"
    env_file:
      - "payment/.env"
    volumes:
      - payment-db-data:/var/lib/postgresql/18/data
    networks:
      - my-global-network

  inventory-db:
    image: postgres:18-alpine
    container_name: inventory-db
    ports:
      - "5435:5432"
    env_file:
      - "inventory/.env"
    volumes:
      - inventory-db-data:/var/lib/postgresql/18/data
    networks:
      - my-global-network

networks:
  my-global-network:
    driver: bridge
    external: true

volumes:
  rabbitmq_data:
  prometheus_data:
  grafana-data:
  order-db-data:
  payment-db-data:
  inventory-db-data:
