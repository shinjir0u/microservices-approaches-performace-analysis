spring:
  application:
    name: orchestrator
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      format_sql: true
  datasource:
    url: ${ORCHESTRATION_ORCHESTRATOR_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST}
    virtual-host: ${SPRING_RABBITMQ_VHOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        observation-enabled: true
    orchestrator:
      start:
        queue: ${ORCHESTRATOR_START_QUEUE}
      order:
        reply:
          queue: ${ORCHESTRATOR_ORDER_REPLY_QUEUE}
      inventory:
        reply:
          queue: ${ORCHESTRATOR_INVENTORY_REPLY_QUEUE}
      payment:
        reply:
          queue: ${ORCHESTRATOR_PAYMENT_REPLY_QUEUE}
    inventory:
      command:
        queue: ${INVENTORY_COMMAND_QUEUE}
        exchange: ${INVENTORY_COMMAND_EXCHANGE}
        routingKey: ${INVENTORY_COMMAND_ROUTING_KEY}
      fail:
        command:
          queue: ${INVENTORY_FAIL_COMMAND_QUEUE}
          exchange: ${INVENTORY_FAIL_COMMAND_EXCHANGE}
          routingKey: ${INVENTORY_FAIL_COMMAND_ROUTING_KEY}
    payment:
      command:
        queue: ${PAYMENT_COMMAND_QUEUE}
        exchange: ${PAYMENT_COMMAND_EXCHANGE}
        routingKey: ${PAYMENT_COMMAND_ROUTING_KEY}
      fail:
        command:
          queue: ${PAYMENT_FAIL_COMMAND_QUEUE}
          exchange: ${PAYMENT_FAIL_COMMAND_EXCHANGE}
          routingKey: ${PAYMENT_FAIL_COMMAND_ROUTING_KEY}
    order:
      command:
        queue: ${ORDER_COMMAND_QUEUE}
        exchange: ${ORDER_COMMAND_EXCHANGE}
        routingKey: ${ORDER_COMMAND_ROUTING_KEY}
      fail:
        command:
          queue: ${ORDER_FAIL_COMMAND_QUEUE}
          exchange: ${ORDER_FAIL_COMMAND_EXCHANGE}
          routingKey: ${ORDER_FAIL_COMMAND_ROUTING_KEY}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: "orchestration-orchestrator"
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://jaeger:4318/v1/traces
          timeout: 30s
        schedule-delay: 1s
        max-batch-size: 256
        max-queue-size: 2048

server:
  port: 8080