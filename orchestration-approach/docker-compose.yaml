services:
  order:
    build:
      context: ./order
      dockerfile: Dockerfile
    container_name: orchestration-order
    ports:
      - "8081:8080"
    env_file:
      - ".env"
      - "../infrastructure/order/.env"
    networks:
      - my-global-network

  payment:
    build:
      context: ./payment
      dockerfile: Dockerfile
    container_name: orchestration-payment
    ports:
      - "8082:8080"
    env_file:
      - ".env"
      - "../infrastructure/payment/.env"
    networks:
      - my-global-network

  inventory:
    build:
      context: ./inventory
      dockerfile: Dockerfile
    container_name: orchestration-inventory
    ports:
      - "8083:8080"
    env_file:
      - ".env"
      - "../infrastructure/inventory/.env"
    networks:
      - my-global-network

  orchestration:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: orchestration-orchestrator
    ports:
      - "8084:8080"
    env_file:
      - ".env"
      - "../infrastructure/orchestrator/.env"
    networks:
      - my-global-network

networks:
  my-global-network:
    external: true
    name: infrastructure_my-global-network